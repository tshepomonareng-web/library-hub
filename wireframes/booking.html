<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking | Community Library Hub</title><link rel="stylesheet" href="main.css"></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header><p><strong>Community Library Hub</strong></p>
<nav aria-label="Primary"><ul>
<li><a href="index.html">Home</a></li><li><a href="resources.html">Find resources</a></li><li><a href="booking.html" aria-current="page">Book a room</a></li></ul></nav></header>
<main id="main">
<h1>Reserve a study room</h1>
<section aria-labelledby="f"><h2 id="f">Your details</h2>
<form action="#"><label for="name">Full name</label><input id="name" autocomplete="name" required>
<label for="email">Email address</label><p class="hint" id="eh">We send your confirmation here.</p>
<input id="email" type="email" autocomplete="email" aria-describedby="eh" required>
<label for="date">Date</label><input id="date" type="date" required>
<label for="room">Room</label><select id="room"><option>Quiet room 1</option><option>Group room 2</option></select>
<button type="submit">Confirm reservation</button></form></section>
<aside aria-labelledby="n"><h2 id="n">Good to know</h2><p>Bookings can be cancelled up to 24 hours before.</p></aside>
</main>
<footer><p>Marlowe Digital prototype for the Local Council. <a href="#main">Back to top</a></p></footer>
</body></html>
